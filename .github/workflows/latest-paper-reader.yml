name: latest-paper-reader

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      arxiv_ids:
        description: "arXiv ID 列表（逗号分隔）"
        required: true
        default: ""
      deep_dive_ids:
        description: "指定进入精读区的 arXiv ID（逗号分隔，可选）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: latest-paper-reader
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
      SUMMARY_API_KEY: ${{ secrets.SUMMARY_API_KEY }}
      SUMMARY_BASE_URL: ${{ secrets.SUMMARY_BASE_URL }}
      SUMMARY_MODEL: ${{ secrets.SUMMARY_MODEL }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv pip install --system -r requirements.txt

      - name: Run pipeline
        run: |
          ARXIV_IDS="${{ github.event.inputs.arxiv_ids }}"
          DEEP_DIVE_IDS="${{ github.event.inputs.deep_dive_ids }}"
          python src/main.py --arxiv-ids "$ARXIV_IDS" $( [ -n "$DEEP_DIVE_IDS" ] && echo "--deep-dive-ids $DEEP_DIVE_IDS" )

          cp -f config.yaml docs/config.yaml

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${GITHUB_REF_NAME:-main}"

          shopt -s nullglob
          paths=(docs config.yaml)
          for d in archive/*/recommend; do
            paths+=("$d")
          done

          git add "${paths[@]}"
          git add -u archive
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "[chore] latest pipeline"

          git status --short
          git reset --hard HEAD
          git fetch origin "$branch"
          git rebase -X theirs "origin/$branch"
          git push origin HEAD:"$branch"
